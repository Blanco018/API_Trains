<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login / Registro</title>
  <!-- Usamos tu CSS existente -->
  <link rel="stylesheet" href="TRENES.css">
</head>
<body>
  <div class="container-login">
    <h1>Iniciar Sesión</h1>
    <form action="/login" method="POST" class="form-login">
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Iniciar sesión</button>
    </form>

    <h1>Registro</h1>
    <form action="/register" method="POST" class="form-register">
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
    </form>
  </div>

  <style>
    /* Si quieres puedes poner estilos propios además de TRENES.css */
    .container-login {
      max-width: 400px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #f5f5f5;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h1 { text-align: center; margin-bottom: 1rem; }
    input { width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; }
    button { width: 100%; padding: 0.5rem; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #45a049; }
    form { margin-bottom: 2rem; }
  </style>
</body>
</html>
