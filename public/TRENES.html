<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trenes de España</title>
  <link rel="stylesheet" href="TRENES.css">
</head>
<body>

  <header>
    <h1>🚆Trenes de España🚆</h1>
    <p>API pública de material ferroviario</p>
  </header>

  <section class="buscador">
    <input type="text" id="search" placeholder="Buscar por serie, apodo u operador...">
  </section>

  <table>
    <thead>
      <tr>
        <th>Serie</th>
        <th>Apodo</th>
        <th>Tipo</th>
        <th>Servicio</th>
        <th>Operador</th>
        <th>Dónde circula</th>
        <th>Logo</th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody id="tabla-trenes">
      <!-- JS mete los datos aquí -->
    </tbody>
  </table>

  <footer>
    <p>Datos servidos por una API en Node.js + Express</p>
  </footer>

  <script src="TRENES.js"></script>
</body>
</html>
