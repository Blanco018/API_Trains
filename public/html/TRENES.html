<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trenes de España</title>
  <link rel="stylesheet" href="/css/TRENES.css">
</head>
<body>

  <header class="main-header">
    <div class="header-user">
      Hola de nuevo, <span id="username-display">...</span>
    </div>
    <div class="header-user" id="user-greeting">
      <h1>🚆TRENES DE ESPAÑA🚆</h1>
      <p class="header-user2">BUSCADOR DE MODELOS FERROVIARIOS</p>
    </div>
    <div>
      <a href="/logout" class="btn-logout">Cerrar sesión</a>
    </div>
  </header>

  <section class="buscador">
    <input type="text" id="search" placeholder="Buscar por serie, apodo u operador...">
  </section>

  <table>
    <thead>
      <tr>
        <th>Serie</th>
        <th>Apodo</th>
        <th>Tipo</th>
        <th>Servicio</th>
        <th>Operador</th>
        <th>Dónde circula</th>
        <th>Logo</th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody id="tabla-trenes">
      <!-- JS mete los datos aquí -->
    </tbody>
  </table>

  <footer>
    <p>Datos servidos por una API en Node.js + Express</p>
  </footer>

  <script src="/js/TRENES.js"></script>
</body>
</html>
