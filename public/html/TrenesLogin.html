<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login / Registro - TrenDex</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/img/logoimg/images.png">
</head>
<body>
  <div class="container-login">
    <h1>Iniciar Sesión</h1>
    <form action="/login" method="POST" class="form-login">
      <input type="text" name="usernameLogIn" placeholder="Usuario" required>
      <input type="password" name="passwordLogIn" placeholder="Contraseña" required>
      <button type="submit">Iniciar sesión</button>
    </form>

    <h1>Registro</h1>
    <form id="formRegister" class="form-register">
      <input type="text" id="usernameRegister" name="usernameRegister" placeholder="Usuario" required>
      <input type="password" id="passwordRegister" name="passwordRegister" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
    </form>

    <!-- MODAL POP-UP -->
    <div id="modalSuccess" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-icon">🎉</div>
        <h2>¡Registro e inicio de sesión exitosos!</h2>
        <p>¿Deseas acceder directamente a la aplicación?</p>
        <div class="modal-actions">
          <button id="btnModalYes" class="btn-modal-yes">Sí, acceder</button>
          <button id="btnModalNo" class="btn-modal-no">No, mantenerme aquí</button>
        </div>
      </div>
    </div>
  </div>
  
    <footer>
      <p>Datos servidos por una API en Node.js + Express</p>
      <p>V0.4.4</p>
    </footer>
  <!-- Carga del script desacoplado -->
  <script src="/js/TrenesLogin.js"></script>
</body>
</html>
